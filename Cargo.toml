[workspace]
resolver = "2"
members = [
    "crates/pixtuoid-core",
    "crates/pixtuoid-scene",
    "crates/pixtuoid",
    "crates/pixtuoid-hook",
]

[workspace.package]
version = "0.16.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/SaM-runtime/maple-agent-market"
authors = ["Ivan Wang <ivanwng97@icloud.com>", "SaM-runtime contributors"]
description = "Unofficial local 2D multi-agent visualizer based on Pixtuoid"
homepage = "https://github.com/SaM-runtime/maple-agent-market"
keywords = ["tui", "pixel-art", "ai-agents", "codex", "visualizer"]
categories = ["command-line-utilities", "visualization"]

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.pixtuoid-scene]
opt-level = 2

[profile.debugging]
inherits = "dev"
debug = true

[workspace.dependencies]
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "8"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }
