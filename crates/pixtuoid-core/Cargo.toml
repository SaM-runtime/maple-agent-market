[package]
name                   = "pixtuoid-core"
description            = "Maple Agent Market headless engine — sources, state and sprites"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
homepage.workspace     = true
keywords.workspace     = true
categories.workspace   = true
# 這個 workspace 測試會引用 sibling crate 的 socket path 實作。
exclude                = ["tests/socket_path_parity.rs"]

[lints]
workspace = true

# `native` 啟用 async runtime、檔案 watcher、hook listener 與 liveness probe；
# `--no-default-features` 則只保留可攜的事件、reducer 與 state。
[features]
default = ["native"]
native  = ["dep:tokio", "dep:notify"]

[dependencies]
tokio       = { workspace = true, features = ["sync", "rt", "macros", "fs", "net", "time", "io-util"], optional = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
notify      = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Safe wrappers for the liveness/exit-watch syscalls the `native` probe layer
# makes: kqueue+kevent (macOS exit_watch), pidfd_open+poll+self-pipe (Linux
# exit_watch), kill(0) (cc_probe). Retires the raw `libc::syscall(SYS_pidfd_open)`
# and the hand-poked `libc::kevent`/`pollfd` structs. Already compiled in the
# workspace (crossterm pulls it); unix-only like `libc`, so the wasm32 core build
# (a NON-unix target) never sees it. libc STAYS for the macOS libproc calls rustix
# doesn't wrap (proc_pidinfo start-time in cc_probe, the fd→path table in fd_probe).
rustix = { version = "1", features = ["event", "process", "pipe"] }

# 0.61 to match the major tokio already pulls (via mio) for this target —
# a second windows-sys major would double-compile the bindings.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "rt", "macros", "fs", "net", "time", "io-util", "rt-multi-thread"] }
# Property-based testing of the pure-core algebraic invariants (the walkable-mask
# geometry today — the rest of the sim-geometry prop modules moved to
# pixtuoid-scene): generate thousands of inputs to falsify a property, shrinking
# any failure to a minimal counterexample. Found failures persist under
# `proptest-regressions/` so they re-run forever.
proptest = "1"
tempfile = "3"
filetime = "0.2"
insta = { version = "1", features = ["yaml"] }
tracing-subscriber = { workspace = true }
