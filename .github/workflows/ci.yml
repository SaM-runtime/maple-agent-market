name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --locked --workspace
      - name: Offline local-asset bootstrap
        shell: powershell
        run: |
          cargo build --locked -p pixtuoid --bin maple-agent-market
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/tests/LocalAssetBootstrap.Tests.ps1
      - name: Public release audit self-test
        run: python scripts/public-release-audit.py --selftest
      - name: Public release tooling self-tests
        run: |
          python scripts/build-public-release.py --selftest
          python scripts/stage-public-release.py --selftest
      - name: Public release audit
        run: python scripts/public-release-audit.py
